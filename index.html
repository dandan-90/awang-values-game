<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>阿旺的价值观之旅 - 三旺通信</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap');
:root{
  /* 设计系统 - 三旺科技蓝 */
  --sw-blue:#3A7BD5;
  --sw-blue-light:#6FB8FF;
  --sw-blue-dark:#1E4E8C;
  --sw-accent:#FFD166;
  --sw-accent-hot:#FF6B6B;
  --sw-success:#06D6A0;
  --sw-purple:#9B5DE5;
  --sw-bg:#0B1026;
  --sw-panel:rgba(18,26,58,.78);
  --sw-panel-border:rgba(111,184,255,.28);
  --sw-text:#F7FAFF;
  --sw-text-dim:rgba(247,250,255,.72);
  --sw-shadow:0 12px 40px rgba(0,0,0,.45);
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;-webkit-font-smoothing:none;text-rendering:geometricPrecision;}
body{background:#0B1026;background-image:linear-gradient(rgba(111,184,255,.035) 2px,transparent 2px),linear-gradient(90deg,rgba(111,184,255,.035) 2px,transparent 2px);background-size:16px 16px;display:flex;justify-content:center;align-items:center;min-height:100vh;min-height:100dvh;font-family:'Zpix','Fusion Pixel 12px monospaced','DotGothic16','Noto Sans SC',monospace;overflow:hidden;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;}
/* Pixel frame: hard edges, stepped double border, no soft shadow */
#game-wrapper{position:relative;border:4px solid #6FB8FF;box-shadow:0 0 0 4px #1B4B8F,0 0 0 8px #0B1026,12px 12px 0 8px rgba(0,0,0,.55);border-radius:0;overflow:hidden;width:960px;height:640px;max-width:100vw;max-height:100vh;max-height:100dvh;background:#0B1026;}
#game-wrapper:hover{border-color:#A8D8FF;box-shadow:0 0 0 4px #2E6FC4,0 0 0 8px #0B1026,12px 12px 0 8px rgba(0,0,0,.55);}
canvas{display:block;border-radius:0;width:100%!important;height:100%!important;image-rendering:pixelated;image-rendering:crisp-edges;}
/* Touch controls — hidden on desktop, visible on touch devices */
#touch-controls{display:none;position:absolute;inset:0;z-index:10;pointer-events:none;}
#touch-controls.active{display:block;}
/* Virtual Joystick — pixel square pad */
#joystick-zone{position:absolute;left:0;bottom:0;width:48%;height:72%;pointer-events:auto;touch-action:none;}
#joystick-base{position:absolute;left:24%;bottom:24%;width:clamp(88px,22vw,124px);height:clamp(88px,22vw,124px);border-radius:0;background:rgba(20,40,90,.55);border:4px solid rgba(111,184,255,.75);box-shadow:0 0 0 4px rgba(11,16,38,.8),inset 0 0 0 4px rgba(11,16,38,.55),8px 8px 0 rgba(0,0,0,.4);pointer-events:none;transform:translate(-50%,-50%);}
#joystick-thumb{position:absolute;width:clamp(44px,11vw,62px);height:clamp(44px,11vw,62px);border-radius:0;background:#6FB8FF;border:4px solid #E8EEF8;box-shadow:0 0 0 4px #1B4B8F,6px 6px 0 rgba(0,0,0,.45);pointer-events:none;transform:translate(-50%,-50%);transition:background .1s;}
#joystick-thumb.active{background:#FFC93C;border-color:#FFF3B0;box-shadow:0 0 0 4px #8A5A18,6px 6px 0 rgba(0,0,0,.45);}
/* Jump button — pixel square */
.touch-btn{position:absolute;border-radius:0;pointer-events:auto;touch-action:none;transition:transform .08s,background .1s;-webkit-tap-highlight-color:transparent;}
.touch-btn.pressed{transform:scale(.92)!important;background:#FFE27A!important;border-color:#FFF3B0!important;box-shadow:0 0 0 4px #8A5A18,6px 6px 0 rgba(0,0,0,.45)!important;}
.btn-jump{right:12%;bottom:18%;width:clamp(92px,21vw,122px);height:clamp(92px,21vw,122px);background:#F4703A;border:4px solid #FFD0A0;box-shadow:0 0 0 4px #8A2E1E,8px 8px 0 rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;}
.btn-label{font-size:clamp(15px,3.2vw,22px);font-weight:800;color:#FFF;text-shadow:3px 3px 0 #8A2E1E;letter-spacing:1px;}
.ctrl-hint{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);color:#A8D8FF;font-size:clamp(10px,1.8vw,12px);font-family:'Zpix','Fusion Pixel 12px monospaced','DotGothic16','Noto Sans SC',monospace;pointer-events:none;text-align:center;width:100%;text-shadow:2px 2px 0 #0B1026;}
.kb-hint{display:block;}
@media(hover:hover)and(pointer:fine){.kb-hint{display:block}.ctrl-hint{display:none}}
@media(hover:none)and(pointer:coarse){.kb-hint{display:none}.ctrl-hint{display:block}}
@media(max-width:480px){#joystick-base{width:96px;height:96px}#joystick-thumb{width:48px;height:48px}.btn-jump{width:96px;height:96px}}
</style>
</head>
<body>
<div id="game-wrapper">
<canvas id="game"></canvas>
<div id="touch-controls">
  <!-- Virtual Joystick -->
  <div id="joystick-zone">
    <div id="joystick-base"><div id="joystick-thumb"></div></div>
  </div>
  <!-- Jump button -->
  <div class="touch-btn btn-jump" data-key=" "><span class="btn-label">Jump</span></div>
  <div class="ctrl-hint">👆 左侧滑动控制方向 | 右侧 Jump 跳跃/确认</div>
</div>
</div>
<script>
// ═══════════════════════════════════════════════════
//  阿旺的价值观之旅 v7.0 — 全像素风重制 (Pixel Remaster)
// ═══════════════════════════════════════════════════
const canvas=document.getElementById('game');
const W=960,H=640;canvas.width=W;canvas.height=H;

// ══════════════════════════════════════════════════════════════
//  PIXEL RENDER ENGINE  ·  全局像素渲染引擎
//  职责：统一接管"如何绘制"，把一切图形转成 4px 网格像素画。
//  原则：不改变任何游戏坐标、尺寸、状态、规则、布局与文案。
// ══════════════════════════════════════════════════════════════
const PX=4;                                   // 像素块尺寸
const PAL=[                                   // 统一有限调色板
  [11,16,38],[20,28,58],[31,43,82],[46,61,107],[58,76,130],
  [27,75,143],[46,111,196],[74,144,217],[111,184,255],[168,216,255],
  [30,122,140],[58,176,196],[111,224,232],[184,245,240],
  [30,92,52],[46,139,74],[88,196,106],[155,232,140],[214,245,168],
  [138,90,24],[200,144,30],[255,201,60],[255,226,122],[255,243,176],
  [138,46,30],[196,74,40],[244,112,58],[255,154,90],[255,208,160],
  [74,42,122],[122,74,184],[168,120,224],[208,168,245],
  [42,46,62],[74,82,104],[122,132,156],[184,194,216],[232,238,248],[255,255,255],
  [74,46,30],[122,74,46],[168,108,62],[208,154,90]
];
const QC=new Map();
function pxSnap(v){return Math.round(v/PX)*PX}
function pxQuant(c){
  if(typeof c!=='string')return c;
  if(QC.has(c))return QC.get(c);
  if(QC.size>4000)QC.clear();
  const s=c.trim().toLowerCase();let r=0,g=0,b=0,a=1,m;
  if(s==='transparent'){QC.set(c,'rgba(0,0,0,0)');return QC.get(c)}
  if((m=s.match(/^#([0-9a-f]{3,4})$/))){const h=m[1];r=parseInt(h[0]+h[0],16);g=parseInt(h[1]+h[1],16);b=parseInt(h[2]+h[2],16);if(h.length===4)a=parseInt(h[3]+h[3],16)/255}
  else if((m=s.match(/^#([0-9a-f]{6})([0-9a-f]{2})?$/))){const h=m[1];r=parseInt(h.slice(0,2),16);g=parseInt(h.slice(2,4),16);b=parseInt(h.slice(4,6),16);if(m[2])a=parseInt(m[2],16)/255}
  else if((m=s.match(/^rgba?\(([^)]+)\)$/))){const p=m[1].split(',').map(v=>parseFloat(v.trim()));r=p[0]|0;g=p[1]|0;b=p[2]|0;if(p.length>3)a=p[3]}
  else{QC.set(c,c);return c}
  if(!(a>0)){QC.set(c,'rgba(0,0,0,0)');return QC.get(c)}
  let best=PAL[0],bd=1e9;
  for(let i=0;i<PAL.length;i++){const p=PAL[i],dr=r-p[0],dg=g-p[1],db=b-p[2],d=dr*dr*.3+dg*dg*.59+db*db*.11;if(d<bd){bd=d;best=p}}
  const out=a>=1?`rgb(${best[0]},${best[1]},${best[2]})`:`rgba(${best[0]},${best[1]},${best[2]},${a.toFixed(3)})`;
  QC.set(c,out);return out;
}
// 渐变 → 4 段硬色带（保留层次，消灭平滑过渡）
function pxGradAt(st,t){if(!st.length)return 'rgb(11,16,38)';let best=st[0][1],bd=1e9;for(let i=0;i<st.length;i++){const d=Math.abs(st[i][0]-t);if(d<bd){bd=d;best=st[i][1]}}return best}
function pxBuildGrad(v,prop,raw){
  const st=v.stops.slice().sort((a,b)=>a[0]-b[0]);
  const ar=v.args.map(n=>typeof n==='number'?pxSnap(n):n);
  const g=v.kind==='radial'?raw.createRadialGradient(ar[0],ar[1],ar[2],ar[3],ar[4],ar[5]):raw.createLinearGradient(ar[0],ar[1],ar[2],ar[3]);
  const N=4;
  for(let i=0;i<N;i++){const a0=i/N,a1=(i+1)/N,col=pxGradAt(st,(a0+a1)/2);g.addColorStop(a0,col);if(a1<1)g.addColorStop(Math.min(1,a1-.0001),col)}
  g.addColorStop(1,pxGradAt(st,1));
  raw[prop]=g;
}
// 方块化：圆 / 椭圆 / 圆角矩形 → 网格单元
function pxArcCells(cx,cy,rx,ry,sa,ea){
  const out=[];if(!(rx>0)||!(ry>0))return out;
  const full=sa===0&&Math.abs(ea-Math.PI*2)<.001;
  const x0=pxSnap(cx-rx),x1=pxSnap(cx+rx),y0=pxSnap(cy-ry),y1=pxSnap(cy+ry);
  for(let y=y0;y<=y1;y+=PX)for(let x=x0;x<=x1;x+=PX){
    const dx=(x+PX/2-cx)/(rx+PX*.15),dy=(y+PX/2-cy)/(ry+PX*.15);
    if(dx*dx+dy*dy>1)continue;
    if(!full){let a=Math.atan2(dy,dx);if(a<0)a+=Math.PI*2;let s=((sa%(Math.PI*2))+Math.PI*2)%(Math.PI*2),e=((ea%(Math.PI*2))+Math.PI*2)%(Math.PI*2);if(e<=s)e+=Math.PI*2;if(a<s)a+=Math.PI*2;if(a>e)continue}
    out.push([pxSnap(x),pxSnap(y)]);
  }
  return out;
}
function pxRoundCells(x,y,w,h,r){
  const out=[],R=typeof r==='number'?r:(r&&r.tl)||0;
  const x0=pxSnap(x),y0=pxSnap(y),x1=pxSnap(x+w),y1=pxSnap(y+h),rad=pxSnap(Math.max(0,Math.min(R,w/2,h/2)));
  for(let yy=y0;yy<y1;yy+=PX){const cy=yy+PX/2;let ins=0;
    if(cy<y0+rad){const d=y0+rad-cy;ins=rad-Math.sqrt(Math.max(0,rad*rad-d*d))}
    else if(cy>y1-rad){const d=cy-(y1-rad);ins=rad-Math.sqrt(Math.max(0,rad*rad-d*d))}
    const L=pxSnap(x0+ins),Rr=pxSnap(x1-ins);
    for(let xx=L;xx<Rr;xx+=PX)out.push([xx,yy]);
  }
  return out;
}
function pxEdgeCells(cells){const set=new Set(cells.map(c=>c[0]+','+c[1]));return cells.filter(([x,y])=>!set.has((x-PX)+','+y)||!set.has((x+PX)+','+y)||!set.has(x+','+(y-PX))||!set.has(x+','+(y+PX)))}
const PX_FONT='"Zpix","Fusion Pixel 12px monospaced","DotGothic16","Press Start 2P","Noto Sans SC",monospace';
function pxFont(v){return String(v).replace(/"Noto Sans SC"|'Noto Sans SC'|Noto Sans SC/g,PX_FONT)}

function makePixelCtx(raw){
  let pending=[],curX=0,curY=0;
  const flush=(mode)=>{
    if(!pending.length)return;
    const pathCells=[],solidCells=[];
    for(const s of pending){
      let cells=s.kind==='round'?pxRoundCells(s.x,s.y,s.w,s.h,s.r):pxArcCells(s.x,s.y,s.rx,s.ry,s.sa,s.ea);
      if(mode==='stroke'){cells=pxEdgeCells(cells);if(s.kind==='round'){solidCells.push(...cells);continue}}
      pathCells.push(...cells);
    }
    pending=[];
    // 圆角面板描边 → 实心像素边框（更精致、更统一）
    if(solidCells.length){
      const fs=raw.fillStyle;raw.fillStyle=raw.strokeStyle;
      for(let i=0;i<solidCells.length;i++)raw.rect(solidCells[i][0],solidCells[i][1],PX,PX);
      raw.fill();raw.fillStyle=fs;raw.beginPath();
    }
    for(let i=0;i<pathCells.length;i++)raw.rect(pathCells[i][0],pathCells[i][1],PX,PX);
  };
  const ov={
    // ── 路径：形状延迟到 fill / stroke 时才决定是填充还是描边 ──
    beginPath(){pending=[];curX=curY=0;raw.beginPath()},
    closePath(){raw.closePath()},
    arc(x,y,r,sa=0,ea=Math.PI*2){pending.push({kind:'arc',x,y,rx:r,ry:r,sa,ea})},
    ellipse(x,y,rx,ry,rot=0,sa=0,ea=Math.PI*2){pending.push({kind:'arc',x,y,rx,ry,sa,ea})},
    roundRect(x,y,w,h,r=0){pending.push({kind:'round',x,y,w,h,r})},
    rect(x,y,w,h){flush('fill');raw.rect(pxSnap(x),pxSnap(y),pxSnap(w),pxSnap(h));curX=x+w;curY=y+h},
    moveTo(x,y){flush('fill');raw.moveTo(pxSnap(x),pxSnap(y));curX=x;curY=y},
    lineTo(x,y){flush('fill');raw.lineTo(pxSnap(x),pxSnap(y));curX=x;curY=y},
    quadraticCurveTo(cx,cy,x,y){flush('fill');const sx=curX,sy=curY,N=8;
      for(let i=1;i<=N;i++){const t=i/N,u=1-t;raw.lineTo(pxSnap(u*u*sx+2*u*t*cx+t*t*x),pxSnap(u*u*sy+2*u*t*cy+t*t*y))}
      curX=x;curY=y},
    bezierCurveTo(a,b,c,d,x,y){flush('fill');const sx=curX,sy=curY,N=8;
      for(let i=1;i<=N;i++){const t=i/N,u=1-t;raw.lineTo(pxSnap(u*u*u*sx+3*u*u*t*a+3*u*t*t*c+t*t*t*x),pxSnap(u*u*u*sy+3*u*u*t*b+3*u*t*t*d+t*t*t*y))}
      curX=x;curY=y},
    fill(){flush('fill');raw.fill()},
    stroke(){flush('stroke');raw.stroke()},
    clip(){flush('fill');raw.clip()},
    // ── 直接绘制 ──
    fillRect(x,y,w,h){raw.fillRect(pxSnap(x),pxSnap(y),pxSnap(w),pxSnap(h))},
    strokeRect(x,y,w,h){raw.strokeRect(pxSnap(x),pxSnap(y),pxSnap(w),pxSnap(h))},
    clearRect(x,y,w,h){pending=[];raw.clearRect(pxSnap(x),pxSnap(y),pxSnap(w),pxSnap(h))},
    fillText(text,x,y,mw){const noGlow=raw.shadowBlur===0,fs=raw.fillStyle;let restore=false;
      // 可读性保护：浅色低透明文字在深色像素面板上会消失，仅对文字提亮
      if(typeof fs==='string'){const m=fs.match(/^rgba\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)\s*\)$/);
        if(m&&parseFloat(m[4])<.34&&parseFloat(m[1])>140&&parseFloat(m[2])>140&&parseFloat(m[3])>140){raw.fillStyle=`rgba(${m[1]},${m[2]},${m[3]},.55)`;restore=true}}
      if(noGlow){raw.shadowColor='rgba(0,0,0,.85)';raw.shadowOffsetX=2;raw.shadowOffsetY=2}
      if(mw!==undefined)raw.fillText(text,x,y,mw);else raw.fillText(text,x,y);
      if(noGlow){raw.shadowOffsetX=0;raw.shadowOffsetY=0;raw.shadowColor='rgba(0,0,0,0)'}
      if(restore)raw.fillStyle=fs;},
    strokeText(text,x,y,mw){if(mw!==undefined)raw.strokeText(text,x,y,mw);else raw.strokeText(text,x,y)},
    setLineDash(a){raw.setLineDash(a.map(v=>Math.max(PX,pxSnap(v))))},
    // ── 渐变：返回伪对象，赋值时构建色带 ──
    createLinearGradient(...a){const v={__px:1,kind:'linear',args:a,stops:[],addColorStop(o,c){this.stops.push([Math.max(0,Math.min(1,o)),pxQuant(c)])}};return v},
    createRadialGradient(...a){const v={__px:1,kind:'radial',args:a,stops:[],addColorStop(o,c){this.stops.push([Math.max(0,Math.min(1,o)),pxQuant(c)])}};return v},
    measureText(t){return raw.measureText(t)}
  };
  return new Proxy(raw,{
    get(t,k){if(k in ov)return ov[k];const v=Reflect.get(raw,k);return typeof v==='function'?v.bind(raw):v},
    set(t,k,v){
      if(k==='fillStyle'||k==='strokeStyle'){if(v&&v.__px)pxBuildGrad(v,k,raw);else raw[k]=typeof v==='string'?pxQuant(v):v;return true}
      if(k==='shadowBlur'){raw.shadowBlur=0;return true}
      if(k==='shadowColor'){raw.shadowColor=typeof v==='string'?pxQuant(v):v;return true}
      if(k==='shadowOffsetX'||k==='shadowOffsetY'){raw[k]=pxSnap(v);return true}
      if(k==='lineWidth'){raw.lineWidth=Math.max(2,pxSnap(v));return true}
      if(k==='font'){raw.font=pxFont(v);return true}
      raw[k]=v;return true;
    },
    has(t,k){return k in ov||Reflect.has(raw,k)}
  });
}
const rawCtx=canvas.getContext('2d');
const ctx=makePixelCtx(rawCtx);
rawCtx.imageSmoothingEnabled=false;


let actx=null;
function audioCtx(){if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();return actx}
function beep(freq,dur,type='square',vol=.06){try{const a=audioCtx(),o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+dur);o.connect(g);g.connect(a.destination);o.start(a.currentTime);o.stop(a.currentTime+dur)}catch(e){}}
function sfxJump(){beep(300,.08,'square',.05);beep(500,.12,'square',.04)}
function sfxCollect(){beep(600,.06,'square',.06);setTimeout(()=>beep(900,.08,'square',.06),60);setTimeout(()=>beep(1200,.1,'square',.05),120)}
function sfxHit(){beep(120,.15,'sawtooth',.07);beep(80,.2,'sawtooth',.06)}
function sfxStomp(){beep(200,.06,'square',.05);beep(400,.1,'square',.06)}
function sfxWin(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.2,'square',.06),i*120))}
function sfxDeath(){[400,300,200,100].forEach((f,i)=>setTimeout(()=>beep(f,.15,'sawtooth',.08),i*100))}
function sfxClick(){beep(800,.04,'square',.03)}

const S={MENU:'menu',L1_INTRO:'l1_intro',L1:'l1',L1_DONE:'l1_done',L2_INTRO:'l2_intro',L2:'l2',L2_DONE:'l2_done',WIN:'win'};
let gs=S.MENU,st=0,ta=1,gt=0;

const keys={};
window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;keys[e.code]=true;e.preventDefault()});
window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;keys[e.code]=false});

// ════════════════════════════════
//  TOUCH & MOBILE SUPPORT (Virtual Joystick)
// ════════════════════════════════
const isMobile=/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)||('ontouchstart' in window);
const tcEl=document.getElementById('touch-controls');
const wrapperEl=document.getElementById('game-wrapper');
if(isMobile||!window.matchMedia('(hover:hover) and (pointer:fine)').matches){tcEl.classList.add('active');}

// Canvas auto-scale
function scaleCanvas(){
  const vw=window.innerWidth,vh=window.innerHeight;
  const scale=Math.min(vw/960,vh/640);
  wrapperEl.style.width=(960*scale)+'px';
  wrapperEl.style.height=(640*scale)+'px';
}
scaleCanvas();window.addEventListener('resize',scaleCanvas);window.addEventListener('orientationchange',()=>setTimeout(scaleCanvas,200));

// ── Virtual Joystick ──
const jZone=document.getElementById('joystick-zone');
const jThumb=document.getElementById('joystick-thumb');
const jBase=document.getElementById('joystick-base');
let jId=null; // touch id currently controlling joystick
let jCX=0,jCY=0; // center of joystick (in wrapper-relative px)
let jMaxR=55; // max thumb travel radius (px, updated on resize)

function updateJoystickMetrics(){
  jMaxR=jBase.getBoundingClientRect().width*.45;
}
updateJoystickMetrics();window.addEventListener('resize',updateJoystickMetrics);

function updateKeysFromJoystick(dx,dy){
  const dead=.2; // dead zone threshold
  const ax=Math.abs(dx)/jMaxR,ay=Math.abs(dy)/jMaxR;
  // Horizontal: require exceeding dead zone
  if(ax>dead){keys['a']=dx<0;keys['arrowleft']=dx<0;keys['d']=dx>0;keys['arrowright']=dx>0;}
  else{keys['a']=keys['arrowleft']=keys['d']=keys['arrowright']=false;}
  // Vertical: require exceeding dead zone (but don't override jump button)
  if(ay>dead){keys['w']=dy<0;keys['arrowup']=dy<0;keys['s']=dy>0;keys['arrowdown']=dy>0;}
  else{keys['w']=keys['arrowup']=keys['s']=keys['arrowdown']=false;}
}

function clearJoystickKeys(){
  keys['a']=keys['arrowleft']=keys['d']=keys['arrowright']=false;
  keys['w']=keys['arrowup']=keys['s']=keys['arrowdown']=false;
}

jZone.addEventListener('touchstart',e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    if(jId!==null)continue; // already controlled
    jId=t.identifier;
    // Floating: move base to touch point
    jCX=t.clientX; jCY=t.clientY;
    jBase.style.left=jCX+'px'; jBase.style.top=jCY+'px';
    jThumb.style.left=jCX+'px'; jThumb.style.top=jCY+'px';
    jThumb.classList.add('active');
  }
},{passive:false});

jZone.addEventListener('touchmove',e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    if(t.identifier!==jId)continue;
    const dx=t.clientX-jCX, dy=t.clientY-jCY;
    const dist=Math.sqrt(dx*dx+dy*dy);
    const clampDist=Math.min(dist,jMaxR);
    const nx=dist>0?(dx/dist)*clampDist:0, ny=dist>0?(dy/dist)*clampDist:0;
    jThumb.style.left=(jCX+nx)+'px'; jThumb.style.top=(jCY+ny)+'px';
    updateKeysFromJoystick(nx,ny);
  }
},{passive:false});

jZone.addEventListener('touchend',e=>{
  for(const t of e.changedTouches){
    if(t.identifier===jId){
      jId=null; jThumb.classList.remove('active');
      // Reset base to default position
      jBase.style.left=''; jBase.style.top='';
      jThumb.style.left='50%'; jThumb.style.top='50%';
      clearJoystickKeys();
    }
  }
});
jZone.addEventListener('touchcancel',e=>{jId=null;jThumb.classList.remove('active');jBase.style.left='';jBase.style.top='';jThumb.style.left='50%';jThumb.style.top='50%';clearJoystickKeys();});

function easeOutCubic(t){return 1-Math.pow(1-t,3)}
function easeInOutCubic(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}

// 带字间距的文本绘制（模拟 letter-spacing）
function drawTextSpaced(ctx,text,x,y,spacing=2,align='center'){
  ctx.save();ctx.textAlign='left';
  const chars=[...text];const widths=chars.map(c=>ctx.measureText(c).width);
  const totalW=widths.reduce((a,b)=>a+b,0)+spacing*(chars.length-1);
  let startX=x;if(align==='center')startX=x-totalW/2;else if(align==='right')startX=x-totalW;
  let cx=startX;
  for(let i=0;i<chars.length;i++){ctx.fillText(chars[i],cx,y);cx+=widths[i]+spacing}
  ctx.restore();
}

// 统一面板绘制：玻璃质感 + 内发光 + 外描边
function drawPanel(ctx,x,y,w,h,r=20,alpha=.85){
  ctx.fillStyle=`rgba(16,24,52,${alpha})`;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();
  const g=ctx.createLinearGradient(x,y,x,y+h);g.addColorStop(0,'rgba(255,255,255,.06)');g.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();
  ctx.strokeStyle='rgba(111,184,255,.32)';ctx.lineWidth=1.5;ctx.beginPath();ctx.roundRect(x+2,y+2,w-4,h-4,r-2);ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.08)';ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.stroke();
}

// 统一按钮绘制：支持 normal / hover / pressed 三态
function drawGameButton(ctx,x,y,w,h,text,state='normal',opts={}){
  const r=h/2;const{primary='#FF6B6B',secondary='#FF8E53',textColor='#FFF',fontSize=20}=opts;
  ctx.save();
  if(state==='pressed')ctx.translate(0,2);
  const g=ctx.createLinearGradient(x,y,x+w,y+h);
  if(state==='hover'){g.addColorStop(0,primary);g.addColorStop(.5,secondary);g.addColorStop(1,primary)}
  else{g.addColorStop(0,secondary);g.addColorStop(.5,primary);g.addColorStop(1,secondary)}
  ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(x+3,y+3,w-6,h-6,r-3);ctx.stroke();
  if(state!=='pressed'){ctx.shadowColor=primary;ctx.shadowBlur=16}
  ctx.fillStyle=textColor;ctx.font=`900 ${fontSize}px "Noto Sans SC"`;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(text,x+w/2,y+h/2+1);ctx.shadowBlur=0;ctx.restore();
}

// 图标徽章绘制：圆形底 + emoji + 微光
function drawIconBadge(ctx,x,y,r,color,emoji,emojiSize=null){
  const g=ctx.createRadialGradient(x,y,2,x,y,r);g.addColorStop(0,'#FFF');g.addColorStop(.4,color);g.addColorStop(1,color+'80');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.5)';ctx.beginPath();ctx.ellipse(x-r*.3,y-r*.35,r*.28,r*.15,-.4,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#FFF';ctx.font=`700 ${emojiSize||r*1.1}px "Noto Sans SC"`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(emoji,x,y+1);
}

function lerp(a,b,t){return a+(b-a)*t}
function clamp(v,lo,hi){return Math.max(lo,Math.min(hi,v))}
function rand(a,b){return a+Math.random()*(b-a)}
function randi(a,b){return Math.floor(rand(a,b+1))}

class Particle{constructor(x,y,vx,vy,color,life,size=3){this.x=x;this.y=y;this.vx=vx;this.vy=vy;this.color=color;this.life=life;this.maxLife=life;this.size=size}
  update(dt){this.x+=this.vx*dt;this.y+=this.vy*dt;this.vy+=300*dt;this.life-=dt}get alive(){return this.life>0}get alpha(){return clamp(this.life/this.maxLife*2,0,1)}}
let parts=[];
function spawnParts(x,y,cnt,color,life=.8){for(let i=0;i<cnt;i++){const a=Math.random()*Math.PI*2,s=60+Math.random()*200;parts.push(new Particle(x,y,Math.cos(a)*s,Math.sin(a)*s-80,color,life+Math.random()*.3,2+Math.random()*3))}}

let shakeX=0,shakeY=0,shakeT=0,shakeI=0;
function shake(dur=.15,int=6){shakeT=dur;shakeI=int}
function updShake(dt){shakeX=shakeY=0;if(shakeT>0){shakeT-=dt;shakeX=(Math.random()-.5)*shakeI*2;shakeY=(Math.random()-.5)*shakeI*2}}

// ════════════════════════════════
//  PLAYER (阿旺) — Canvas精绘
// ════════════════════════════════
class Player{
  constructor(x,y){this.x=x;this.y=y;this.w=38;this.h=50;this.vx=0;this.vy=0;this.speed=280;this.jForce=-560;this.grav=1350;this.grounded=false;this.facing=1;this.wc=0;this.squash=1;this.stretch=1;this.inv=0;this.hp=5;this.maxHp=5;this.acd=0;this.bobY=0;this.ability=null;this.abilityTimer=0;this.shieldHP=0;this.speedMult=1}
  update(dt,plats){
    const md=(keys['d']||keys['arrowright']?1:0)-(keys['a']||keys['arrowleft']?1:0);
    if(md!==0)this.facing=md>0?1:-1;this.vx=md*this.speed*this.speedMult;this.vy+=this.grav*dt;
    if((keys['w']||keys['arrowup']||keys[' '])&&this.grounded){this.vy=this.jForce;this.grounded=false;sfxJump()}
    this.vy=Math.min(this.vy,800);this.x+=this.vx*dt;this.y+=this.vy*dt;this.grounded=false;
    for(const p of plats){const px=this.x+5,pw=this.w-10;if(px+pw>p.x&&px<p.x+p.w&&this.y+this.h>=p.y&&this.y+this.h-this.vy*dt<=p.y+12){this.y=p.y-this.h;this.vy=0;this.grounded=true}}
    if(this.y+this.h>580){this.y=580-this.h;this.vy=0;this.grounded=true}if(this.y<0){this.y=0;this.vy=0}
    if(md!==0&&this.grounded)this.wc+=dt*8;else if(this.grounded)this.wc*=.85;
    const ts=this.grounded?1:.82;this.squash=lerp(this.squash,ts,.2);this.stretch=lerp(this.stretch,1/ts,.2);
    if(this.inv>0)this.inv-=dt;if(this.acd>0)this.acd-=dt;
    this.bobY=this.grounded&&md===0?Math.sin(gt*2.5)*2:0;
    // Ability timer
    if(this.abilityTimer>0){this.abilityTimer-=dt;if(this.abilityTimer<=0){this.ability=null;this.abilityTimer=0;this.shieldHP=0;this.speedMult=1}}
  }
  draw(ctx,camX=0,camY=0,viewMode='side'){
    const sx=this.x-camX,sy=this.y-camY,cx=sx+this.w/2,cy=sy+this.h/2;
    ctx.save();ctx.translate(cx,cy+this.bobY);
    const sc=this.squash,st=this.stretch;
    const flash=this.inv>0&&Math.floor(this.inv*20)%2===0;
    if(viewMode==='topdown'){
      ctx.scale(st,sc);if(flash)ctx.globalAlpha=.5;
      this._drawTopDown(ctx);
    }else if(viewMode==='front'){
      ctx.scale(this.facing*st,sc);if(flash)ctx.globalAlpha=.5;
      this._drawFront(ctx);
    }else{
      ctx.scale(this.facing*st,sc);if(flash)ctx.globalAlpha=.5;
      this._drawSide(ctx);
    }
    ctx.restore();
  }
  _drawShadow(ctx,dy,sy){
    ctx.fillStyle='rgba(0,0,0,.18)';ctx.beginPath();ctx.ellipse(0,dy+sy,16,5,0,0,Math.PI*2);ctx.fill();
  }
  _drawAntenna(ctx){
    // Antenna wire with arc
    ctx.strokeStyle='#2962AF';ctx.lineWidth=2.5;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(0,-24);ctx.quadraticCurveTo(4,-34,2,-40);ctx.stroke();
    // Antenna glow ball
    const ag=ctx.createRadialGradient(2,-40,1,2,-40,8);
    ag.addColorStop(0,'rgba(160,220,255,.95)');ag.addColorStop(.5,'rgba(74,144,217,.5)');ag.addColorStop(1,'transparent');
    ctx.fillStyle=ag;ctx.beginPath();ctx.arc(2,-40,8,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#80D4FF';ctx.beginPath();ctx.arc(2,-40,4,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#FFF';ctx.beginPath();ctx.arc(0,-42,1.8,0,Math.PI*2);ctx.fill();
  }
  _drawHeadphones(ctx){
    // Left headphone
    ctx.fillStyle='#1A4A8A';ctx.beginPath();ctx.roundRect(-17,-18,7,12,3);ctx.fill();
    ctx.fillStyle='#2962AF';ctx.beginPath();ctx.roundRect(-19,-19,11,8,3);ctx.fill();
    ctx.fillStyle='#1A4A8A';ctx.beginPath();ctx.arc(-13.5,-13,6,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#3A7CC3';ctx.beginPath();ctx.arc(-13.5,-13,3.5,0,Math.PI*2);ctx.fill();
    // Right headphone
    ctx.fillStyle='#1A4A8A';ctx.beginPath();ctx.roundRect(10,-18,7,12,3);ctx.fill();
    ctx.fillStyle='#2962AF';ctx.beginPath();ctx.roundRect(8,-19,11,8,3);ctx.fill();
    ctx.fillStyle='#1A4A8A';ctx.beginPath();ctx.arc(13.5,-13,6,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#3A7CC3';ctx.beginPath();ctx.arc(13.5,-13,3.5,0,Math.PI*2);ctx.fill();
    // Headband
    ctx.strokeStyle='#1A4A8A';ctx.lineWidth=3.5;ctx.lineCap='butt';
    ctx.beginPath();ctx.arc(0,-15,13,Math.PI*1.15,-Math.PI*0.15);ctx.stroke();
  }
  _drawBody(ctx,showDetails){
    // Body shadow
    ctx.fillStyle='rgba(0,0,0,.12)';ctx.beginPath();ctx.ellipse(0,20,17,6,0,0,Math.PI*2);ctx.fill();
    // Main body (rounded square, blue)
    const bg=ctx.createLinearGradient(0,8,0,26);
    bg.addColorStop(0,'#5BA0E8');bg.addColorStop(.3,'#4A90D9');bg.addColorStop(.7,'#3D7CC6');bg.addColorStop(1,'#2962AF');
    ctx.fillStyle=bg;ctx.beginPath();ctx.roundRect(-15,8,30,19,8);ctx.fill();
    // Body outline
    ctx.strokeStyle='#1A4A8A';ctx.lineWidth=1.5;ctx.beginPath();ctx.roundRect(-15,8,30,19,8);ctx.stroke();
    // Body top highlight
    ctx.fillStyle='rgba(255,255,255,.15)';ctx.beginPath();ctx.roundRect(-13,9,26,5,5);ctx.fill();
    // Belly panel (white)
    ctx.fillStyle='#F5F8FF';ctx.beginPath();ctx.roundRect(-11,10.5,22,14.5,5);ctx.fill();
    ctx.strokeStyle='#C8D4E0';ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(-11,10.5,22,14.5,5);ctx.stroke();
    if(!showDetails)return;
    // LED strip (8 tiny lights)
    const leds=['#4FC3F7','#81C784','#FFD54F','#FF8A65','#CE93D8','#EF5350','#FFB74D','#4DD0E1'];
    for(let i=0;i<8;i++){const lx=-9+i*2.6,a=.4+Math.sin(gt*4+i*.8)*.4;ctx.globalAlpha=a*.8+.15;ctx.fillStyle=leds[i];ctx.beginPath();ctx.roundRect(lx,12,2,1.5,1);ctx.fill()}ctx.globalAlpha=1;
    // 4x RJ45 ports
    for(let i=0;i<4;i++){const px=-6.5+i*4,py=15.8;
      ctx.fillStyle='#37474F';ctx.beginPath();ctx.roundRect(px,py,3.8,7,1);ctx.fill();
      ctx.fillStyle='#1A1A2E';ctx.beginPath();ctx.roundRect(px+.4,py+.4,3,6.2,.8);ctx.fill();
      ctx.fillStyle='#FFD700';for(let j=0;j<4;j++)ctx.fillRect(px+.7,py+1.3+j*1.3,1.8,.5);
      const lOn=Math.sin(gt*3+i)*.5+.5>.3;ctx.fillStyle=lOn?'#4CAF50':'#1B5E20';ctx.beginPath();ctx.arc(px-.6,py+3,.8,0,Math.PI*2);ctx.fill()}
  }
  _drawArms(ctx,swing){
    // Left arm
    ctx.fillStyle='#4A90D9';ctx.beginPath();ctx.roundRect(-19.5,4+swing*.4,6.5,15,3.5);ctx.fill();
    ctx.fillStyle='#2962AF';ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(-19.5,4+swing*.4,6.5,15,3.5);ctx.stroke();
    ctx.fillStyle='#6BB2F0';ctx.fillRect(-18.5,4.5+swing*.4,3,3);
    ctx.fillStyle='#F5F8FF';ctx.beginPath();ctx.roundRect(-19,16+swing*.4,6,4,2);ctx.fill();
    // Right arm
    ctx.fillStyle='#4A90D9';ctx.beginPath();ctx.roundRect(13,4-swing*.4,6.5,15,3.5);ctx.fill();
    ctx.fillStyle='#2962AF';ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(13,4-swing*.4,6.5,15,3.5);ctx.stroke();
    ctx.fillStyle='#6BB2F0';ctx.fillRect(15.5,4.5-swing*.4,3,3);
    ctx.fillStyle='#F5F8FF';ctx.beginPath();ctx.roundRect(13,16-swing*.4,6,4,2);ctx.fill();
  }
  _drawLegs(ctx,lOff){
    ctx.fillStyle='#3578BD';
    ctx.beginPath();ctx.roundRect(-9,25.5,8,7.5,2.5);ctx.fill();
    ctx.beginPath();ctx.roundRect(1,25.5,8,7.5,2.5);ctx.fill();
    ctx.fillStyle='#FFF';ctx.beginPath();ctx.roundRect(-9+lOff*.3,32.5,10,3.5,2);ctx.fill();
    ctx.beginPath();ctx.roundRect(-1-lOff*.3,32.5,10,3.5,2);ctx.fill();
  }
  _drawFace(ctx){
    // Face panel
    ctx.fillStyle='#F5F8FF';ctx.beginPath();ctx.roundRect(-10,-16,20,17,5);ctx.fill();
    ctx.strokeStyle='#C8D4E0';ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(-10,-16,20,17,5);ctx.stroke();
    // Face highlight
    ctx.fillStyle='rgba(255,255,255,.3)';ctx.beginPath();ctx.roundRect(-9,-15,18,7,4);ctx.fill();
    // Eyes
    ctx.fillStyle='#1B3A5C';ctx.beginPath();ctx.arc(-4.5,-9,4,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(4.5,-9,4,0,Math.PI*2);ctx.fill();
    // Eye highlights
    ctx.fillStyle='#FFF';ctx.beginPath();ctx.arc(-3.5,-10.5,1.5,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(5.5,-10.5,1.5,0,Math.PI*2);ctx.fill();
    // Blush
    ctx.fillStyle='rgba(255,150,170,.4)';ctx.beginPath();ctx.ellipse(-7.5,-4.5,3.5,2.2,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(7.5,-4.5,3.5,2.2,0,0,Math.PI*2);ctx.fill();
    // Mouth
    ctx.strokeStyle='#1B3A5C';ctx.lineWidth=1.3;ctx.beginPath();ctx.arc(0,-1.5,3.5,.15,Math.PI-.15);ctx.stroke();
  }
  _drawHead(ctx){
    // Head shadow
    ctx.fillStyle='rgba(0,0,0,.08)';ctx.beginPath();ctx.ellipse(0,8,16,4,0,0,Math.PI*2);ctx.fill();
    // Main head (rounded square, blue)
    const hg=ctx.createLinearGradient(0,-21,0,8);
    hg.addColorStop(0,'#6BB2F0');hg.addColorStop(.3,'#4A90D9');hg.addColorStop(.7,'#3D7CC6');hg.addColorStop(1,'#2962AF');
    ctx.fillStyle=hg;ctx.beginPath();ctx.roundRect(-15,-21,30,29,10);ctx.fill();
    ctx.strokeStyle='#1A4A8A';ctx.lineWidth=1.5;ctx.beginPath();ctx.roundRect(-15,-21,30,29,10);ctx.stroke();
    // Head highlight arc
    ctx.fillStyle='rgba(255,255,255,.12)';ctx.beginPath();ctx.roundRect(-12,-19,24,10,8);ctx.fill();
  }
  _drawSide(ctx){
    // Ability glow behind player
    if(this.ability){const ac={shield:'#FFD700',speed:'#4FC3F7',reveal:'#CE93D8',wave:'#81C784'};const g=ctx.createRadialGradient(0,5,2,0,5,35);g.addColorStop(0,(ac[this.ability]||'#FFF')+'40');g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,5,35,0,Math.PI*2);ctx.fill();if(this.ability==='shield'&&this.shieldHP>0){ctx.strokeStyle=ac.shield+'80';ctx.lineWidth=3;ctx.setLineDash([4,4]);ctx.beginPath();ctx.arc(0,5,28,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);}}
    this._drawShadow(ctx,0,26);
    this._drawAntenna(ctx);
    this._drawHeadphones(ctx);
    this._drawHead(ctx);
    this._drawFace(ctx);
    this._drawBody(ctx,true);
    const swing=this.grounded?Math.sin(this.wc)*10:0;
    this._drawArms(ctx,swing);
    const lOff=this.grounded?Math.sin(this.wc)*4:3;
    this._drawLegs(ctx,lOff);
  }
  _drawFront(ctx){
    // Front (menu/overview) — slightly larger, symmetrical
    // Ability glow
    if(this.ability){const ac={shield:'#FFD700',speed:'#4FC3F7',reveal:'#CE93D8',wave:'#81C784'};const g=ctx.createRadialGradient(0,5,2,0,5,35);g.addColorStop(0,(ac[this.ability]||'#FFF')+'40');g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,5,35,0,Math.PI*2);ctx.fill()}
    this._drawShadow(ctx,0,26);
    this._drawAntenna(ctx);
    this._drawHeadphones(ctx);
    this._drawHead(ctx);
    this._drawFace(ctx);
    this._drawBody(ctx,true);
    const swing=Math.sin(this.wc)*6;
    this._drawArms(ctx,swing);
    const lOff=Math.sin(this.wc)*3;
    this._drawLegs(ctx,lOff);
  }
  _drawTopDown(ctx){
    // Top-down (俯视) — compact overhead version
    // Shadow
    ctx.fillStyle='rgba(0,0,0,.15)';ctx.beginPath();ctx.ellipse(0,12,16,6,0,0,Math.PI*2);ctx.fill();
    // Thruster flames
    const tf=gt*18;
    for(let i=0;i<3;i++){const c=['#FF4400','#FFAA00','#FFEE88'];ctx.fillStyle=c[i];ctx.beginPath();ctx.arc(Math.sin(tf+i)*2.5,17+i*5,5-i,0,Math.PI*2);ctx.fill()}
    // Head (top-down: circle seen from above)
    const hg=ctx.createRadialGradient(0,-6,3,0,-2,14);
    hg.addColorStop(0,'#6BB2F0');hg.addColorStop(.5,'#4A90D9');hg.addColorStop(1,'#2962AF');
    ctx.fillStyle=hg;ctx.beginPath();ctx.arc(0,-3,14,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#1A4A8A';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(0,-3,14,0,Math.PI*2);ctx.stroke();
    // Face panel (from above — smaller oval)
    ctx.fillStyle='#F5F8FF';ctx.beginPath();ctx.ellipse(0,-3,9,7,0,0,Math.PI*2);ctx.fill();
    // Eyes (from above — smaller dots)
    ctx.fillStyle='#1B3A5C';ctx.beginPath();ctx.arc(-4,-4.5,2.5,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(4,-4.5,2.5,0,Math.PI*2);ctx.fill();
    // Antenna short
    ctx.strokeStyle='#2962AF';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,-16);ctx.quadraticCurveTo(2,-21,1,-23);ctx.stroke();
    ctx.fillStyle='#80D4FF';ctx.beginPath();ctx.arc(1,-23,3,0,Math.PI*2);ctx.fill();

  draw(ctx){if(this.isEnemy){const g=ctx.createRadialGradient(this.x,this.y,1,this.x,this.y,7);g.addColorStop(0,'#FF8A8A');g.addColorStop(.5,'#FF4444');g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.beginPath();ctx.arc(this.x,this.y,7,0,Math.PI*2);ctx.fill();ctx.fillStyle='#FFF';ctx.beginPath();ctx.arc(this.x,this.y,2,0,Math.PI*2);ctx.fill()}else{const g=ctx.createLinearGradient(this.x,this.y+8,this.x,this.y-8);g.addColorStop(0,'transparent');g.addColorStop(.5,this.color);g.addColorStop(1,'#FFF');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(this.x,this.y-10);ctx.lineTo(this.x+2,this.y+8);ctx.lineTo(this.x-2,this.y+8);ctx.fill();ctx.fillStyle='#FFF';ctx.beginPath();ctx.arc(this.x,this.y-6,2.5,0,Math.PI*2);ctx.fill();const gg=ctx.createRadialGradient(this.x,this.y-6,1,this.x,this.y-6,8);gg.addColorStop(0,this.color+'70');gg.addColorStop(1,'transparent');ctx.fillStyle=gg;ctx.beginPath();ctx.arc(this.x,this.y-6,8,0,Math.PI*2);ctx.fill()}}}

class L2EnemyShip{constructor(x,y,type='normal'){this.x=x;this.y=y;this.w=28;this.h=28;this.type=type;this.hp=type==='boss'?20:1;this.maxHp=this.hp;this.sp=type==='boss'?30:35+rand(0,50);this.mode=type==='boss'?'boss':randi(0,2);this.timer=0;this.shootCD=0}
  update(dt,bullets){
    this.y+=this.sp*dt;this.timer+=dt;
    if(this.mode==='weave')this.x+=Math.sin(this.timer*3.5)*70*dt;
    else if(this.mode==='zigzag'&&this.timer>.15)this.x+=(Math.sin(this.timer*5)*100)*dt;
    else if(this.mode==='boss'){this.x+=Math.sin(this.timer*1.3)*50*dt;this.y=clamp(this.y,25,180)}
    this.x=clamp(this.x,15,W-15-this.w);this.shootCD-=dt;
    if((this.type==='boss'&&this.shootCD<=0)||(this.type!=='boss'&&this.shootCD<=0&&Math.random()<.008)){
      if(this.type==='boss'){for(let a=-.2;a<=.2;a+=.08)bullets.push(new L2Bullet(this.x+this.w/2,this.y+this.h,Math.sin(a)*60,100,'#FF4444',true));this.shootCD=.5}
      else if(Math.random()<.25){bullets.push(new L2Bullet(this.x+this.w/2,this.y+this.h,0,140,'#FF4444',true));this.shootCD=1.8}}
  }
  get alive(){return this.y<H+60&&this.y>-60&&this.x<W+60&&this.x>-60}
  draw(ctx){if(this.hp<=0)return;
    if(this.type==='boss'){
      // Boss glow
      const bg=ctx.createRadialGradient(this.x+this.w/2,this.y+this.h/2,5,this.x+this.w/2,this.y+this.h/2,48);bg.addColorStop(0,'rgba(231,76,60,.35)');bg.addColorStop(1,'transparent');ctx.fillStyle=bg;ctx.beginPath();ctx.arc(this.x+this.w/2,this.y+this.h/2,48,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#8B0000';ctx.fillRect(this.x-3,this.y-3,this.w+6,this.h+6);const bodyG=ctx.createLinearGradient(this.x,this.y,this.x,this.y+this.h);bodyG.addColorStop(0,'#C0392B');bodyG.addColorStop(1,'#7B241C');ctx.fillStyle=bodyG;ctx.fillRect(this.x,this.y,this.w,this.h);ctx.fillStyle='#FFD166';ctx.beginPath();ctx.moveTo(this.x+3,this.y-4);ctx.lineTo(this.x+7,this.y-14);ctx.lineTo(this.x+14,this.y-5);ctx.lineTo(this.x+21,this.y-14);ctx.lineTo(this.x+25,this.y-4);ctx.fill();
      // Boss HP bar
      ctx.fillStyle='rgba(0,0,0,.7)';ctx.beginPath();ctx.roundRect(this.x-5,this.y-24,this.w+10,10,5);ctx.fill();const hpPct=this.hp/this.maxHp;const hpc=hpPct>.5?'#06D6A0':hpPct>.25?'#FFD166':'#FF6B6B';ctx.fillStyle=hpc;ctx.beginPath();ctx.roundRect(this.x-3,this.y-22,(this.w+6)*hpPct,6,3);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(this.x-5,this.y-24,this.w+10,10,5);ctx.stroke();
      ctx.fillStyle='#FFF';ctx.font='700 9px "Noto Sans SC"';ctx.textAlign='center';ctx.fillText('BOSS',this.x+this.w/2,this.y-28)
    }
    else{const eg=ctx.createRadialGradient(this.x+14,this.y+14,2,this.x+14,this.y+14,18);eg.addColorStop(0,'rgba(231,76,60,.25)');eg.addColorStop(1,'transparent');ctx.fillStyle=eg;ctx.beginPath();ctx.arc(this.x+14,this.y+14,18,0,Math.PI*2);ctx.fill();ctx.fillStyle='#5D4037';ctx.beginPath();ctx.arc(this.x+14,this.y+14,14,0,Math.PI*2);ctx.fill();ctx.fillStyle='#8D6E63';ctx.beginPath();ctx.arc(this.x+14,this.y+14,11,0,Math.PI*2);ctx.fill();ctx.fillStyle='#FFF';ctx.beginPath();ctx.arc(this.x+8,this.y+10,3.5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(this.x+20,this.y+10,3.5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#000';ctx.beginPath();ctx.arc(this.x+9,this.y+11,1.6,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(this.x+21,this.y+11,1.6,0,Math.PI*2);ctx.fill()}}}

class L2TreasureDrop{constructor(x,y,idx,data){this.x=x;this.y=y;this.w=46;this.h=46;this.idx=idx;this.data=data;this.collected=false;this.anim=0;this.life=12}
  update(dt){if(this.collected)this.anim+=dt*3;else this.life-=dt}
  draw(ctx){if(this.life<=0||(this.collected&&this.anim>1))return;ctx.save();ctx.globalAlpha=this.collected?1-this.anim:clamp(this.life/3,0,1);
    const cx=this.x+23,cy=this.y+23,pulse=.9+.1*Math.sin(gt*4+this.idx);
    // Glow
    const g2=ctx.createRadialGradient(cx,cy,6,cx,cy,36*pulse);g2.addColorStop(0,this.data.color+'55');g2.addColorStop(1,'transparent');ctx.fillStyle=g2;ctx.beginPath();ctx.arc(cx,cy,36*pulse,0,Math.PI*2);ctx.fill();
    // Gem body
    const g=ctx.createRadialGradient(cx,cy-4,3,cx,cy,24);g.addColorStop(0,'#FFF');g.addColorStop(.4,this.data.color);g.addColorStop(1,this.data.color+'70');ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,22,0,Math.PI*2);ctx.fill();
    // Shine
    ctx.fillStyle='rgba(255,255,255,.5)';ctx.beginPath();ctx.ellipse(cx-6,cy-6,6,3,-.6,0,Math.PI*2);ctx.fill();
    // Inner ring + star
    ctx.strokeStyle='rgba(255,255,255,.45)';ctx.lineWidth=1.8;ctx.beginPath();ctx.arc(cx,cy,15,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle='#FFF';ctx.font='700 17px "Noto Sans SC"';ctx.textAlign='center';ctx.fillText('⭐',cx,cy+6);
    // Name tag
    const tw=ctx.measureText(this.data.name).width+16;ctx.fillStyle='rgba(12,22,52,.8)';ctx.beginPath();ctx.roundRect(cx-tw/2,cy-42,tw,20,9);ctx.fill();ctx.strokeStyle=this.data.color+'75';ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(cx-tw/2+1,cy-41,tw-2,18,8);ctx.stroke();
    ctx.fillStyle='#FFF';ctx.font='700 11px "Noto Sans SC"';ctx.textAlign='center';ctx.fillText(this.data.name,cx,cy-28);ctx.restore();
    if(this.collected){ctx.save();ctx.globalAlpha=1-this.anim;ctx.translate(cx,cy);ctx.scale(1+this.anim*2,1+this.anim*2);ctx.fillStyle=this.data.color;ctx.font='900 22px "Noto Sans SC"';ctx.textAlign='center';ctx.shadowColor=this.data.color;ctx.shadowBlur=12;ctx.fillText(this.data.name,0,7);ctx.shadowBlur=0;ctx.restore()}}}

class Level2{
  constructor(){
    this.player={x:W/2-18,y:H-110,w:36,h:48,speed:320,invinv:0,hp:5,maxHp:5,ability:null,abilityTimer:0,fireMult:1,homing:false};
    this.bullets=[];this.enemies=[];this.drops=[];
    this.wave=1;this.waveEnemies=5;this.waveSpawned=0;this.spawnCD=0;
    this.tc=[false,false,false,false];this.col=0;this.done=false;
    this.msg='第 1 波！消灭敌人收集宝物！';this.msgT=2.5;
    this.bossActive=false;this.bossDefeated=false;this.killCount=0;this.killsPerDrop=4;
    this.fireTimer=0;this.bgStars=[];
    for(let i=0;i<130;i++){
      this.bgStars.push({
        x:Math.random()*W,y:Math.random()*H,
        s:1+Math.random()*3,a:.3+Math.random()*.5
      });
    }
  }
  _reset(){
    this.player.hp=this.player.maxHp;
    this.player.inv=2;
    this.player.x=W/2-18;this.player.y=H-110;
    this.player.ability=null;this.player.abilityTimer=0;this.player.fireMult=1;this.player.homing=false;
    this.bullets.length=0;this.enemies.length=0;this.drops.length=0;
    this.wave=1;this.waveEnemies=5;this.waveSpawned=0;this.spawnCD=0;
    this.killCount=0;this.bossActive=false;this.bossDefeated=false;
    this.msg='重新出击！';this.msgT=2;
    sfxDeath();
  }
  _spawnEnemy(){
    const ex=rand(30,W-60),ey=-35;
    const r=rand(0,1);
    const type=r<.7?'normal':r<.85?'weave':'zigzag';
    this.enemies.push(new L2EnemyShip(ex,ey,type));
    this.waveSpawned++;
  }
  _checkBulletHit(e,b){
    if(b.isEnemy)return false;
    var dx=Math.abs(b.x-e.x-e.w/2);
    var dy=Math.abs(b.y-e.y-e.h/2);
    return dx<e.w/2+3&&dy<e.h/2+6;
  }
  _onEnemyKilled(e){
    sfxStomp();
    spawnParts(e.x+e.w/2,e.y+e.h/2,12,'#FF6B6B',.5);
    this.killCount++;
    if(!this.bossActive&&this.killCount>=this.killsPerDrop&&this.col<4){
      this.killCount=0;
      var ti=this.col;
      this.drops.push(new L2TreasureDrop(e.x+e.w/2-23,e.y+e.h/2-23,ti,T2[ti]));
    }
    if(e.type==='boss'){
      this.bossDefeated=true;
      this.msg='BOSS击败！';this.msgT=3;
      sfxWin();
      spawnParts(e.x+e.w/2,e.y+e.h/2,45,'#FFD700',1.5);
      shake(.3,8);
    }
  }
  _checkPlayerHit(b){
    if(!b.isEnemy||this.player.inv>0)return;
    var dx=Math.abs(b.x-this.player.x-this.player.w/2);
    var dy=Math.abs(b.y-this.player.y-this.player.h/2);
    if(dx<this.player.w/2+3&&dy<this.player.h/2+4){
      b.y=999;
      this.player.hp--;
      this.player.inv=1.5;
      sfxHit();
      spawnParts(this.player.x+this.player.w/2,this.player.y+this.player.h/2,6,'#E74C3C',.4);
    }
  }
  update(dt){
    if(this.done)return;
    if(this.player.hp<=0||this.player.y<-30){this._reset();return}
    // movement
    var dx=(keys['d']||keys['arrowright']?1:0)-(keys['a']||keys['arrowleft']?1:0);
    var dy=(keys['s']||keys['arrowdown']?1:0)-(keys['w']||keys['arrowup']?1:0);
    if(dx||dy){var l=Math.sqrt(dx*dx+dy*dy);this.player.x+=dx/l*this.player.speed*dt;this.player.y+=dy/l*this.player.speed*dt}
    this.player.x=clamp(this.player.x,8,W-8-this.player.w);
    this.player.y=clamp(this.player.y,35,H-8-this.player.h);
    if(this.player.inv>0)this.player.inv-=dt;
    // Ability timer
    if(this.player.abilityTimer>0){this.player.abilityTimer-=dt;if(this.player.abilityTimer<=0){this.player.ability=null;this.player.abilityTimer=0;this.player.fireMult=1;this.player.homing=false}}
    // auto-fire
    this.fireTimer-=dt;
    if(this.fireTimer<=0){
      this.fireTimer=.13/this.player.fireMult;
      if(this.player.homing){
        // Find closest enemy for homing
        let closest=null,cd=9999;
        for(const e of this.enemies){if(e.hp<=0)continue;const d=Math.hypot(e.x+e.w/2-this.player.x,e.y+e.h/2-this.player.y);if(d<cd){cd=d;closest=e}}
        if(closest){const dx=(closest.x+closest.w/2-this.player.x-this.player.w/2)/80,dy=(closest.y+closest.h/2-this.player.y)/80;this.bullets.push(new L2Bullet(this.player.x+this.player.w/2,this.player.y-4,dx*140,-420-dy*80,'#FF69B4'))}
      }else{
        this.bullets.push(new L2Bullet(this.player.x+this.player.w/2,this.player.y-4,0,-520,'#FFD700'));
      }
      if(this.player.fireMult>=2){
        this.bullets.push(new L2Bullet(this.player.x+2,this.player.y-2,-40,-500,'#FFD700'));
        this.bullets.push(new L2Bullet(this.player.x+this.player.w-2,this.player.y-2,40,-500,'#FFD700'));
      }
      if(this.player.fireMult>=3){
        this.bullets.push(new L2Bullet(this.player.x-4,this.player.y,0,-480,'#FFD700'));
        this.bullets.push(new L2Bullet(this.player.x+this.player.w+4,this.player.y,0,-480,'#FFD700'));
      }
      if(this.bossActive&&this.player.fireMult===1){
        this.bullets.push(new L2Bullet(this.player.x+2,this.player.y-2,0,-500,'#FFD700'));
        this.bullets.push(new L2Bullet(this.player.x+this.player.w-2,this.player.y-2,0,-500,'#FFD700'));
      }
    }
    // spawn enemies
    if(!this.bossActive&&!this.bossDefeated){
      if(this.waveSpawned<this.waveEnemies){
        this.spawnCD-=dt;
        if(this.spawnCD<=0){this.spawnCD=.3+Math.random()*.7;this._spawnEnemy()}
      }else if(this.enemies.length===0){
        this.wave++;this.waveEnemies=Math.min(15,5+(this.wave-1)*2);
        this.waveSpawned=0;this.msg='第 '+this.wave+' 波！准备迎战！';this.msgT=1.5;
      }
    }
    // trigger boss
    if(this.col>=4&&!this.bossActive&&!this.bossDefeated&&this.enemies.length===0){
      this.bossActive=true;
      this.enemies.push(new L2EnemyShip(W/2-18,-60,'boss'));
      this.msg='BOSS来袭！全力开火！';this.msgT=2.5;sfxWin();
    }
    // update bullets
    for(var b of this.bullets)b.update(dt);
    this.bullets=this.bullets.filter(function(b){return b.alive});
    // combat - enemy bullets hit enemies
    for(var e of this.enemies){
      if(e.hp<=0)continue;
      e.update(dt,this.bullets);
      for(var b of this.bullets){
        if(!b.isEnemy&&this._checkBulletHit(e,b)){
          e.hp--;b.y=-99;
          if(e.hp<=0)this._onEnemyKilled(e);
          break;
        }
      }
      for(var b2 of this.bullets)this._checkPlayerHit(b2);
      if(this.player.inv<=0&&this.player.x+this.player.w>e.x&&this.player.x<e.x+e.w&&
         this.player.y+this.player.h>e.y&&this.player.y<e.y+e.h){
        this.player.hp--;this.player.inv=1.5;sfxHit();
        spawnParts(this.player.x+this.player.w/2,this.player.y+this.player.h/2,8,'#E74C3C',.5);
      }
    }
    this.enemies=this.enemies.filter(function(e){return e.alive&&e.hp>0});
    if(!this.done&&this.bossActive&&this.bossDefeated&&this.enemies.length===0){
      this.done=true;this.msg='全部宝物收集！三旺价值观圆满！';this.msgT=3;
    }
    // drops
    for(var d of this.drops){
      d.update(dt);
      if(!d.collected&&!this.tc[d.idx]&&d.life>0&&
         this.player.x+this.player.w>d.x&&this.player.x<d.x+d.w&&
         this.player.y+this.player.h>d.y&&this.player.y<d.y+d.h){
        d.collected=true;this.tc[d.idx]=true;this.col++;
        this.msg='获得宝物：'+d.data.name+'！'+this._getAbilityMsg(d.data.name);this.msgT=2.5;
        this._activateL2Ability(d.data.name);
        sfxCollect();spawnParts(d.x+13,d.y+13,28,d.data.color,1.2);
      }
    }
    this.drops=this.drops.filter(function(d){return d.life>0&&(!d.collected||d.anim<1)});
    for(var p of parts)p.update(dt);
    parts=parts.filter(function(p){return p.alive});
    updShake(dt);
    if(this.msgT>0)this.msgT-=dt;
  }
  draw(ctx){
    // Deep space background with nebula
    const bg=ctx.createRadialGradient(W/2,H/2,80,W/2,H,900);bg.addColorStop(0,'#0d1438');bg.addColorStop(.45,'#080a24');bg.addColorStop(1,'#02030c');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
    // Nebula clouds
    const ng=ctx.createRadialGradient(W*.3,H*.4,10,W*.3,H*.4,260);ng.addColorStop(0,'rgba(111,184,255,.12)');ng.addColorStop(1,'transparent');ctx.fillStyle=ng;ctx.beginPath();ctx.arc(W*.3,H*.4,260,0,Math.PI*2);ctx.fill();
    const ng2=ctx.createRadialGradient(W*.75,H*.6,10,W*.75,H*.6,220);ng2.addColorStop(0,'rgba(155,93,229,.1)');ng2.addColorStop(1,'transparent');ctx.fillStyle=ng2;ctx.beginPath();ctx.arc(W*.75,H*.6,220,0,Math.PI*2);ctx.fill();
    // Stars
    for(const s of this.bgStars){s.y+=s.s*70*0.016;if(s.y>H+5){s.y=-5;s.x=Math.random()*W}const twinkle=s.a+.12*Math.sin(gt*2+s.x);ctx.fillStyle=`rgba(255,255,255,${clamp(twinkle,0,1)})`;ctx.beginPath();ctx.arc(s.x,s.y,s.s*.55,0,Math.PI*2);ctx.fill()}
    // Horizontal scanlines (subtle)
    ctx.strokeStyle='rgba(80,120,255,.025)';ctx.lineWidth=1;for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
    for(const b of this.bullets)b.draw(ctx);
    for(const e of this.enemies)if(e.hp>0)e.draw(ctx);
    for(const d of this.drops)d.draw(ctx);
    // Player (top-down 阿旺 back view)
    const px=this.player.x+this.player.w/2,py=this.player.y+this.player.h/2;
    const flash=this.player.inv>0&&Math.floor(this.player.inv*20)%2===0;
    ctx.save();ctx.translate(px,py);if(flash)ctx.globalAlpha=.5;
    // Engine glow under ship
    const eg=ctx.createRadialGradient(0,8,2,0,8,28);eg.addColorStop(0,'rgba(255,107,107,.5)');eg.addColorStop(1,'transparent');ctx.fillStyle=eg;ctx.beginPath();ctx.arc(0,8,28,0,Math.PI*2);ctx.fill();
    // Thruster flame
    const tf=gt*18;
    for(let i=0;i<3;i++){const c=['#FF4400','#FFAA00','#FFEE88'];ctx.fillStyle=c[i];ctx.beginPath();ctx.arc(Math.sin(tf+i)*2.5,13+i*6,5-i,0,Math.PI*2);ctx.fill()}
    // Top-down detailed draw
    ctx.fillStyle='rgba(0,0,0,.12)';ctx.beginPath();ctx.ellipse(0,10,16,5,0,0,Math.PI*2);ctx.fill();
    const hg=ctx.createRadialGradient(0,-6,3,0,-2,14);
    hg.addColorStop(0,'#6BB2F0');hg.addColorStop(.5,'#4A90D9');hg.addColorStop(1,'#2962AF');
    ctx.fillStyle=hg;ctx.beginPath();ctx.arc(0,-3,14,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#1A4A8A';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(0,-3,14,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle='#F5F8FF';ctx.beginPath();ctx.ellipse(0,-3,9,7,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#1B3A5C';ctx.beginPath();ctx.arc(-4,-4.5,2.5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(4,-4.5,2.5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,150,170,.35)';ctx.beginPath();ctx.ellipse(-6,-2,2.5,1.5,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(6,-2,2.5,1.5,0,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#2962AF';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,-16);ctx.quadraticCurveTo(2,-22,1,-24);ctx.stroke();
    ctx.fillStyle='#80D4FF';ctx.beginPath();ctx.arc(1,-24,3,0,Math.PI*2);ctx.fill();
    const pb=ctx.createLinearGradient(0,-2,0,16);
    pb.addColorStop(0,'#5BA0E8');pb.addColorStop(.5,'#3D7CC6');pb.addColorStop(1,'#2962AF');

  const rs=easeOutCubic(clamp((st-.5)/1,0,1));ctx.save();ctx.translate(W/2,392);ctx.scale(rs,rs);const ng=ctx.createRadialGradient(0,0,5,0,0,125);ng.addColorStop(0,'rgba(255,209,102,.55)');ng.addColorStop(.5,'rgba(255,209,102,.2)');ng.addColorStop(1,'transparent');ctx.fillStyle=ng;ctx.beginPath();ctx.arc(0,0,125,0,Math.PI*2);ctx.fill();ctx.fillStyle='#FFD166';ctx.shadowColor='rgba(255,209,102,.55)';ctx.shadowBlur=20;ctx.font='900 84px "Noto Sans SC"';ctx.fillText('10 亿',0,0);ctx.shadowBlur=0;ctx.restore();
  ctx.fillStyle='rgba(255,255,255,.8)';ctx.font='500 15px "Noto Sans SC"';ctx.textAlign='center';ctx.fillText('🎯 为三旺通信点赞',W/2,448);
  // A-Wang celebrating
  const danceY=Math.sin(gt*6)*16;const danceR=Math.sin(gt*4)*.08;
  ctx.save();ctx.translate(W/2,512+danceY);ctx.rotate(danceR);
  const celeb=new Player(-19,-44);celeb.wc=gt*3;celeb.facing=1;celeb.grounded=true;celeb.draw(ctx,0,0,'front');
  ctx.restore();
  // Orbiting celebration particles
  for(let i=0;i<6;i++){const a=gt*2.5+i*1.05,dd=34+Math.sin(gt*1.5+i)*10;ctx.fillStyle=['#FFD166','#FF69B4','#4FC3F7','#06D6A0','#9B5DE5','#FF8E53'][i];ctx.globalAlpha=.6+Math.sin(gt*4+i)*.2;ctx.beginPath();ctx.arc(W/2+Math.cos(a)*dd,478+Math.sin(a*1.2)*dd,5,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}
  const pa=.55+Math.sin(gt*3)*.25;ctx.fillStyle=`rgba(255,255,255,${pa})`;ctx.font='700 17px "Noto Sans SC"';ctx.textAlign='center';ctx.fillText('按 空格键 重新开始冒险',W/2,572);
  ctx.fillStyle='rgba(255,255,255,.45)';ctx.font='500 12px "Noto Sans SC"';ctx.fillText('3onedata 三旺通信 — 连接无限可能',W/2,598);
}

// ════════════════════════════════
//  GAME LOOP
// ════════════════════════════════
let l1=null,l2=null,lt=performance.now();
function startL1(){shakeT=0;l1=new Level1();gs=S.L1;st=0;ta=1}
function startL2(){shakeT=0;l2=new Level2();gs=S.L2;st=0;ta=1}

function loop(ts){
  requestAnimationFrame(loop);
  let dt=(ts-lt)/1000;if(dt<=0||dt>.1)dt=.016;lt=ts;gt+=dt;
  try{
  ctx.clearRect(0,0,W,H);
  if(ta>0)ta=Math.max(0,ta-dt*2.5);
  switch(gs){
    case S.MENU:st+=dt;drawMenu();if((keys[' ']||keys['enter'])&&ta<=0){sfxClick();gs=S.L1_INTRO;st=0;ta=1;keys[' ']=false;keys['enter']=false}break;
    case S.L1_INTRO:st+=dt;drawIntro(1,T1);if((keys[' ']||keys['enter'])&&ta<=0){sfxClick();startL1();keys[' ']=false;keys['enter']=false}break;
    case S.L1:l1.update(dt);l1.draw(ctx);if(l1.done){gs=S.L1_DONE;st=0;ta=1;sfxWin()}break;
    case S.L1_DONE:st+=dt;drawComplete(1,T1);if((keys[' ']||keys['enter'])&&ta<=0){sfxClick();gs=S.L2_INTRO;st=0;ta=1;keys[' ']=false;keys['enter']=false}break;
    case S.L2_INTRO:st+=dt;drawIntro(2,T2);if((keys[' ']||keys['enter'])&&ta<=0){sfxClick();startL2();keys[' ']=false;keys['enter']=false}break;
    case S.L2:l2.update(dt);l2.draw(ctx);if(l2.done){gs=S.L2_DONE;st=0;ta=1;sfxWin()}break;
    case S.L2_DONE:st+=dt;drawComplete(2,T2);if((keys[' ']||keys['enter'])&&ta<=0){sfxClick();gs=S.WIN;st=0;ta=1;keys[' ']=false;keys['enter']=false}break;
    case S.WIN:st+=dt;drawWin();if((keys[' ']||keys['enter'])&&ta<=0){sfxClick();gs=S.MENU;st=0;ta=1;keys[' ']=false;keys['enter']=false}break;
  }
  if(ta>0){ctx.fillStyle=`rgba(0,0,0,${ta})`;ctx.fillRect(0,0,W,H)}
  }catch(e){ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);ctx.fillStyle='#E74C3C';ctx.font='16px "Noto Sans SC"';ctx.textAlign='center';ctx.fillText('Error: '+e.message,W/2,H/2);console.error(e)}
}

canvas.addEventListener('click',()=>{keys[' ']=true;setTimeout(()=>keys[' ']=false,100)});
// Polyfills
if(!ctx.roundRect){ctx.roundRect=function(x,y,w,h,r){if(typeof r==='number')r={tl:r,tr:r,br:r,bl:r};ctx.beginPath();ctx.moveTo(x+r.tl,y);ctx.lineTo(x+w-r.tr,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r.tr);ctx.lineTo(x+w,y+h-r.br);ctx.quadraticCurveTo(x+w,y+h,x+w-r.br,y+h);ctx.lineTo(x+r.bl,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r.bl);ctx.lineTo(x,y+r.tl);ctx.quadraticCurveTo(x,y,x+r.tl,y);ctx.closePath()}}
if(!ctx.ellipse){ctx.ellipse=function(x,y,rx,ry,rot,sa,ea,ccw){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(rx,ry);ctx.arc(0,0,1,sa,ea,ccw);ctx.restore()}}
// Initialize and start
ta=0.01; // Start with minimal fade instead of full black
lt=performance.now();requestAnimationFrame(loop);
console.log('🎮 阿旺的价值观之旅 v7.0 — 全像素风重制');
</script>
